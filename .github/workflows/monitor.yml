name: Pokemon Card Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-card-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python monitor.py
      - name: Run monitor

        env:

          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}

          PYTHONUNBUFFERED: "1"

        run: |

          echo "===== COMMIT ====="

          git rev-parse HEAD

          echo "===== MONITOR VERSION CHECK ====="

          grep -n "SALE_KEYWORDS\|EXCLUDE_KEYWORDS\|version.*2\|KEYWORDS" monitor.py || true

          echo "===== RUN MONITOR ====="

          python monitor.py
