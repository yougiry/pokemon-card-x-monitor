name: Pokemon Card Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-card-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python monitor.py

      - name: Save monitoring state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes."
            exit 0
          fi

          cp data/state.json /tmp/state.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/state.json data/state.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json
          git commit -m "Update monitoring state"
          git push origin HEAD:main
