name: Pokemon Card Source Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test official sources
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python source_test.py
