name: Pokemon Card Monitor V3B Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-card-v3b-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run V3B dry test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python monitor_v3b.py

      - name: Save V3 test state
        run: |
          if git diff --quiet -- data/state_v3_test.json; then
            echo "No V3 test state changes."
            exit 0
          fi

          cp data/state_v3_test.json /tmp/state_v3_test.json

          git fetch origin main
          git reset --hard origin/main

          mkdir -p data
          cp /tmp/state_v3_test.json data/state_v3_test.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state_v3_test.json
          git commit -m "Update V3 test state"
          git push origin HEAD:main
