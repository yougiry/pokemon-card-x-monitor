name: Pokemon Card Monitor V3B Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-card-v3b-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run V3B dry test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python monitor_v3b.py

      - name: Debug V3 state
        run: |
          echo "=== FILE ==="
          ls -l data/state_v3_test.json || true

          echo "=== GIT STATUS ==="
          git status --short

          echo "=== GIT DIFF ==="
          git diff -- data/state_v3_test.json || true

          echo "=== STATE COUNTS ==="
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/state_v3_test.json")

          print("exists:", p.exists())

          if p.exists():
              state = json.loads(p.read_text(encoding="utf-8"))
              print("events:", len(state.get("events", {})))
              print("pending:", len(state.get("pending", {})))
              print("posted:", len(state.get("posted", {})))
          PY

      - name: Save V3 test state
        run: |
          set -e

          if [ ! -f data/state_v3_test.json ]; then
            echo "ERROR: data/state_v3_test.json does not exist."
            exit 1
          fi

          echo "=== STATE GENERATED BY MONITOR ==="
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/state_v3_test.json")
          state = json.loads(p.read_text(encoding="utf-8"))

          print("events:", len(state.get("events", {})))
          print("pending:", len(state.get("pending", {})))
          print("posted:", len(state.get("posted", {})))
          PY

          cp data/state_v3_test.json /tmp/state_v3_test.json

          git fetch origin main
          git reset --hard origin/main

          mkdir -p data
          cp /tmp/state_v3_test.json data/state_v3_test.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/state_v3_test.json

          echo "=== STAGED STATUS ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No V3 test state changes."
            exit 0
          fi

          git commit -m "Update V3 test state"
          git push origin HEAD:main
